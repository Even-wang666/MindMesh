name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:dsh-deps
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:dir
      - run: pnpm check:package-deps
      - name: Smoke-test plugins without external pnpm
        shell: pwsh
        run: |
          $env:MINDMESH_PLUGIN_SMOKE_EXE = Join-Path $PWD 'release\win-unpacked\MindMesh.exe'
          node scripts/plugin-smoke.mjs
      - name: Smoke-test the packaged security boundary
        shell: pwsh
        run: |
          $env:MINDMESH_E2E_EXE = Join-Path $PWD 'release\win-unpacked\MindMesh.exe'
          node scripts/electron-e2e-smoke.mjs --security-only
