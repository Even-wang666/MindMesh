<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>MindMesh installer UI prototype</title>
<style>
  /* PROTOTYPE: three installer structures, switch with ?variant=A|B|C. */
  :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#171717;background:#dfe3ea;--iris:#1d4ed8;--jade:#2b825d;--mint:#8ed9b8;--canvas:#f7f7f9}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}.window{width:760px;height:500px;background:white;border-radius:18px;overflow:hidden;box-shadow:0 24px 80px #17171726;position:relative}.logo{width:64px;height:64px;border-radius:16px}.eyebrow{color:var(--iris);font-weight:700;font-size:13px;letter-spacing:.08em}.title{font-size:30px;font-weight:750;line-height:1.25;margin:12px 0}.copy{color:#1717178f;line-height:1.7}.footer{position:absolute;left:0;right:0;bottom:0;height:76px;padding:18px 28px;display:flex;justify-content:flex-end;gap:12px;border-top:1px solid #1717171c;background:white}.button{height:40px;padding:0 24px;border:0;border-radius:10px;font-weight:700}.primary{background:var(--iris);color:white}.secondary{background:#1717170d;color:#171717}.a{display:grid;grid-template-columns:255px 1fr;height:424px}.a aside{background:var(--iris);color:white;padding:48px 36px}.a main{padding:62px 56px}.mesh{margin-top:90px;width:130px;height:2px;background:var(--mint);box-shadow:38px 18px 0 var(--mint),75px -8px 0 var(--mint)}
  .b{height:424px;background:var(--canvas);padding:28px}.brandbar{display:flex;align-items:center;gap:12px;height:52px}.brandbar .logo{width:40px;height:40px;border-radius:10px}.card{background:white;border-radius:14px;padding:38px 42px;margin-top:22px;box-shadow:0 12px 36px #17171712}.steps{display:flex;gap:8px;margin-top:32px}.dot{height:6px;width:38px;border-radius:99px;background:#17171718}.dot.on{background:var(--iris)}
  .c{display:grid;grid-template-columns:210px 1fr;height:424px}.c aside{padding:30px;background:var(--canvas);border-right:1px solid #17171716}.c main{padding:50px}.step{padding:12px 0;color:#17171770}.step.on{color:var(--iris);font-weight:700}.step:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#17171724;margin-right:10px}.step.on:before{background:var(--iris);box-shadow:0 0 0 5px #1d4ed81a}.switcher{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:8px;border-radius:999px;background:#171717;color:white;box-shadow:0 10px 30px #17171744}.switcher button{width:34px;height:34px;border:0;border-radius:50%;background:#ffffff18;color:white}.switcher span{min-width:190px;text-align:center}.hidden{display:none}
</style>
<body>
  <section class="window variant" data-variant="A"><div class="a"><aside><img class="logo" src="../../resources/icon.png"><h2>MindMesh</h2><p>多智能体协作桌面平台</p><div class="mesh"></div></aside><main><div class="eyebrow">WELCOME</div><div class="title">开始构建你的<br>智能体协作空间</div><p class="copy">安装向导会引导你完成许可确认、安装范围和目录选择。</p></main></div><div class="footer"><button class="secondary button">取消</button><button class="primary button">开始安装</button></div></section>
  <section class="window variant" data-variant="B"><div class="b"><div class="brandbar"><img class="logo" src="../../resources/icon.png"><strong>MindMesh</strong></div><div class="card"><div class="eyebrow">安装向导</div><div class="title">欢迎使用 MindMesh</div><p class="copy">一个明亮、专注的桌面空间，让多个智能体共同处理复杂任务。</p><div class="steps"><i class="dot on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></div></div><div class="footer"><button class="secondary button">取消</button><button class="primary button">继续</button></div></section>
  <section class="window variant" data-variant="C"><div class="c"><aside><img class="logo" src="../../resources/icon.png"><h3>安装 MindMesh</h3><div class="step on">欢迎</div><div class="step">许可协议</div><div class="step">安装选项</div><div class="step">完成</div></aside><main><div class="eyebrow">步骤 1 / 4</div><div class="title">欢迎使用 MindMesh</div><p class="copy">我们只需要几步即可完成安装。你可以选择安装范围和存放位置。</p></main></div><div class="footer"><button class="secondary button">取消</button><button class="primary button">下一步</button></div></section>
  <nav class="switcher"><button id="prev">←</button><span id="label"></span><button id="next">→</button></nav>
<script>
  const variants=['A','B','C']; let current=new URLSearchParams(location.search).get('variant')||'A';
  const render=()=>{document.querySelectorAll('.variant').forEach(x=>x.classList.toggle('hidden',x.dataset.variant!==current));label.textContent=`${current} · ${current==='A'?'品牌英雄区':current==='B'?'轻量白卡':'步骤导航'}`;history.replaceState(null,'',`?variant=${current}`)};
  const move=n=>{current=variants[(variants.indexOf(current)+n+variants.length)%variants.length];render()};prev.onclick=()=>move(-1);next.onclick=()=>move(1);addEventListener('keydown',e=>{if(!['INPUT','TEXTAREA'].includes(e.target.tagName)){if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)}});render();
</script>
</body></html>
